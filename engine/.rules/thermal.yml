# Module: thermal
# Description: rule base for thermal info
# Version: 0.01

module: thermal

check_interval: 10

system_vars:
  thermal_zones: "auto"

fields:
  - name: temperature
    description: "system average temparature"
    source: average_temp
    unit: "celsius"
    base_value: 108
    warning_multiplier: 0.878
    critical_multiplier: 0.921

  - name: max_temp
    description: "hottest zone across all zones"
    source: zone_temparatures
    unit: "celsius"
    base_value: 108
    warning_multiplier: 0.898
    critical_multiplier: 0.935
  
